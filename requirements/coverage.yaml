orphans:
  - behavior: "Actor attribution discipline — every write requires an explicit actor from a closed 3-value enum; MCP writing tools accept only the two Claude actors, and Actor.USER is reachable only through the web view's reject route"
    code_paths: [backend/mcp_server.py, backend/api.py, backend/db_models.py]
    suggested_requirement: "When a write reaches the graph, the system shall require an explicit actor of user, claude_interactive or claude_scheduled with no default; writes over MCP shall be attributable only to the two Claude actors, and the user actor shall be recordable only by the web view's preference-rejection route."
  - behavior: "ChildOf tree served to the web view — GET /api/things returns one tree level (top level is the active Things no active parent claims), with active-child flags per node and user-model Things excluded"
    code_paths: [backend/api.py, backend/queries.py]
    suggested_requirement: "When the web view requests a tree level, the system shall return the active children of the named parent — or, with no parent, the active Things not claimed as a child by any active Thing — each flagged with whether it has active children, excluding Things tagged with the user-model tags."
  - behavior: "Standing questions as deterministic MCP tools — due_for_checkin (checkin_date arrived), blocked (source of a Blocks edge whose target is active), and needs_input (#NeedsInput tag, bounded with total/truncated)"
    code_paths: [backend/queries.py, backend/mcp_server.py]
    suggested_requirement: "When a session asks the standing questions, the system shall answer deterministically from indexes — active Things whose check-in date has arrived, Things whose Blocks target is still active, and active Things tagged #NeedsInput returned with a total so a capped answer is visible as capped."
  - behavior: "Filter-only retrieval — find_things filters by tags (any/all), active state, check-in window and priority range, with deliberately no text or semantic search anywhere in the service"
    code_paths: [backend/queries.py, backend/mcp_server.py]
    suggested_requirement: "When a client lists Things, the system shall filter by tags, active state, check-in date range and priority range only, and shall provide no text or semantic search."
  - behavior: "Read-only web API with exactly one write — five /api routes (tree, thing detail, history, user model always including rejected, reject-preference); POST /api/preferences/{id}/reject is the only mutation"
    code_paths: [backend/api.py]
    suggested_requirement: "When the web frontend calls /api, the system shall serve read-only views of the tree, Thing detail, journal history and user model (rejected preferences always included and marked), and shall accept exactly one write — rejecting a preference — journalled as the user actor."
  - behavior: "Default PA behaviour served from the server — get_initial_instructions derives the capture behaviour plus hat orientation at call time, four MCP prompts each load one fixed preference scope, and shared conventions are constants the scheduled prompt files must carry verbatim (test-enforced)"
    code_paths: [backend/prompts.py, backend/mcp_server.py, prompts/scheduled, backend/tests/test_scheduled_prompts.py]
    suggested_requirement: "When a session connects to /mcp, the system shall serve the default assistant behaviour via a get_initial_instructions tool derived at call time from the capture prompt (never a second copy), shall register four prompts each loading exactly one of the fixed preference scopes, and shall hold the shared conventions as constants that the scheduled prompt files must carry verbatim."
  - behavior: "Scheduled-pass heartbeats and watchdog — each external pass keeps one top-level active #ScheduledTask Thing whose checkin_date is pushed to tomorrow on completion, and a noon-UTC GitHub Actions job files a missed-run issue (plus optional ntfy ping) when fewer than three heartbeats exist or any is due"
    code_paths: [prompts/scheduled, .github/workflows/scheduled-run-health.yml]
    suggested_requirement: "When a scheduled pass completes, it shall set its own top-level #ScheduledTask Thing's check-in date to tomorrow, and when the daily watchdog finds fewer than three such heartbeats or any still due at noon UTC, the system's CI shall file a missed-run issue and send the configured notification."
  - behavior: "No LLM in the service — no pipeline stage, model call or LLM dependency exists anywhere in the backend; every tool returns deterministic data or third-party evidence, enforced by a build-failing architecture test"
    code_paths: [backend/tests/test_architecture.py, docs/vision.md]
    suggested_requirement: "The system shall originate no LLM call and hold no LLM dependency; every tool shall return deterministic data or third-party evidence, with interpretation performed entirely by the connected client."
