[project]
name = "reli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.1",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pgvector>=0.4.2",
    "google-api-python-client>=2.127.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "PyJWT>=2.12.1",
    "pyyaml>=6.0",
    "prometheus-client>=0.16.0",
    "sentry-sdk[fastapi]>=2.60.0",
    "litellm>=1.80.0",
    "google-adk>=2.1.0",
    "arize-phoenix>=8.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "openinference-instrumentation-google-adk>=0.1.13",
    "supabase>=2.0.0",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.0",
    "mcp>=1.27.1",
    "strawberry-graphql>=0.316.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "types-PyYAML>=6.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term --cov-report=html"

[tool.coverage.report]
fail_under = 70

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-var", "misc"]
