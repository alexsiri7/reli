[project]
name = "reli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sentry-sdk[fastapi]>=2.68.1",
    "sqlmodel>=0.0.42",
    "alembic>=1.19.2",
    "psycopg2>=2.9.12",
    # Upper bound is deliberate: mcp 2.x is a different API surface.
    "mcp>=1.26.0,<2.0.0",
    # Direct: backend/google_client.py talks to Google's REST APIs over it.
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-PyYAML>=6.0.12.20260815",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term --cov-report=html"

[tool.coverage.report]
fail_under = 70

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-var", "misc"]
