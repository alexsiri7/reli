[project]
name = "reli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "openai>=2.44.0",
    "python-dotenv>=1.0.0",
    "cryptography>=48.0.0",
    "pgvector>=0.4.2",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.54.0",
    "google-auth-oauthlib>=1.4.0",
    "PyJWT>=2.13.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.16.0",
    "sentry-sdk[fastapi]>=2.63.0",
    "litellm>=1.86.2",
    "google-adk>=2.1.0",
    "arize-phoenix>=17.27.0,<20.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "openinference-instrumentation-google-adk>=0.1.15",
    "supabase>=2.0.0",
    "sqlmodel>=0.0.39",
    "alembic>=1.18.5",
    "psycopg2>=2.9.12",
    "mcp>=1.28.1,<2.0.0",
    "strawberry-graphql>=0.316.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "types-PyYAML>=6.0.12.20260815",
    "pytest-cov>=7.1.0",
    "freezegun>=1.2.0",
    "respx>=0.23.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term --cov-report=html"

[tool.coverage.report]
fail_under = 70

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["type-var", "misc"]
