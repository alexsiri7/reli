# Staging environment — runs alongside production on the same host.
# Port 8001 to avoid conflicts with production (port 8000).
# Its own Postgres and its own volume, so staging never touches production data.
# Both files read the same .env on this host, so every STAGING_* variable is distinct from
# production's: STAGING_DATABASE_URL so staging never touches production data, and
# STAGING_SECRET_KEY, STAGING_RELI_BASE_URL and STAGING_GOOGLE_AUTH_REDIRECT_URI so neither deploy
# accepts a token the other minted (#1697, #1813).

services:
  reli-staging:
    image: ghcr.io/alexsiri7/reli:${RELI_IMAGE_TAG:-latest}
    container_name: reli-staging
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=${STAGING_DATABASE_URL:?STAGING_DATABASE_URL must be set for staging}
      # Defaulted-empty, not required: an unset Google credential answers 401 on the surface it
      # guards and keeps /healthz green, which beats refusing to boot and rolling the deploy back.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # The Google sign-in behind /oauth/*, on the same terms: empty closes both the sign-in and
      # /mcp, never a boot failure. The key and the issuer are staging's own, with no fallback to
      # production's: a fallback would share them again whenever the staging variable is unset.
      - SECRET_KEY=${STAGING_SECRET_KEY:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - GOOGLE_AUTH_REDIRECT_URI=${STAGING_GOOGLE_AUTH_REDIRECT_URI:-}
      - RELI_BASE_URL=${STAGING_RELI_BASE_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # The rate limiter's settings (backend/rate_limit.py). The limits are bare names, passed only
      # when set on the host: an empty value would fail their int parse and the boot.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - RATE_LIMIT_REGISTRATION_PER_MINUTE
      - RATE_LIMIT_AUTH_PER_MINUTE
      - RATE_LIMIT_API_PER_MINUTE
      # A deploy hides its API schema, but PRODUCTION would also refuse postgres-staging's
      # sslmode=disable, so staging hides the docs alone (#1720).
      - HIDE_API_DOCS=1
    depends_on:
      postgres-staging:
        condition: service_healthy
    # The server binds an unprivileged port and needs no Linux capability (#1712).
    cap_drop:
      - ALL
    # Nothing in the service writes a file — every byte it keeps is in Postgres — so the root
    # filesystem can be read-only, and no setuid binary can raise a process's privileges (#1818).
    security_opt:
      - no-new-privileges:true
    read_only: true
    restart: unless-stopped

  postgres-staging:
    image: postgres:16-alpine
    container_name: reli-postgres-staging
    environment:
      - POSTGRES_USER=reli
      - POSTGRES_PASSWORD=${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD must be set for staging}
      - POSTGRES_DB=reli_staging
    volumes:
      - reli-postgres-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reli -d reli_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  reli-postgres-staging:
