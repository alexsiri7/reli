# Staging environment — runs alongside production on the same host.
# Port 8001 to avoid conflicts with production (port 8000).
# Its own Postgres and its own volume, so staging never touches production data.
# STAGING_DATABASE_URL is a distinct variable from production's DATABASE_URL for
# that reason: both files read the same .env on this host.

services:
  reli-staging:
    image: ghcr.io/alexsiri7/reli:${RELI_IMAGE_TAG:-latest}
    container_name: reli-staging
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=${STAGING_DATABASE_URL:?STAGING_DATABASE_URL must be set for staging}
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}
      # The web view's password, on the same terms: empty answers 401 to / and /api and keeps
      # /healthz green, so a deploy without it does not roll back.
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD:-}
      # Defaulted-empty like MCP_API_TOKEN: an unset Google credential must not fail a boot.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
      # The Google sign-in behind /oauth/*, on the same terms: empty closes the sign-in and keeps
      # /mcp on the static token, never a boot failure.
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - GOOGLE_AUTH_REDIRECT_URI=${GOOGLE_AUTH_REDIRECT_URI:-}
      - RELI_BASE_URL=${RELI_BASE_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-staging:
        condition: service_healthy
    restart: unless-stopped

  postgres-staging:
    image: postgres:16-alpine
    container_name: reli-postgres-staging
    environment:
      - POSTGRES_USER=reli
      - POSTGRES_PASSWORD=${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD must be set for staging}
      - POSTGRES_DB=reli_staging
    volumes:
      - reli-postgres-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reli -d reli_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  reli-postgres-staging:
