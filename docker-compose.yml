services:
  reli:
    build: .
    image: ghcr.io/alexsiri7/reli:${RELI_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # No default: an unset DATABASE_URL must fail the boot, not silently bind the
      # service to the local `postgres` container instead of the real database.
      - DATABASE_URL=${DATABASE_URL}
      # Defaulted-empty, not required: an unset Google credential answers 401 on the surface it
      # guards and keeps /healthz green, which beats refusing to boot and rolling the deploy back.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # The Google sign-in behind /oauth/*, on the same terms: empty closes both the sign-in and
      # /mcp, never a boot failure.
      - SECRET_KEY=${SECRET_KEY:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - GOOGLE_AUTH_REDIRECT_URI=${GOOGLE_AUTH_REDIRECT_URI:-}
      - RELI_BASE_URL=${RELI_BASE_URL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Local development database: `docker compose --profile localdb up -d`,
  # with DATABASE_URL pointed at it. Never started for production.
  postgres:
    image: postgres:16-alpine
    profiles: [localdb]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-reli}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-reli}
      - POSTGRES_DB=${POSTGRES_DB:-reli}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reli-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reli} -d ${POSTGRES_DB:-reli}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  reli-postgres:
