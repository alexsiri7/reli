name: Dependency Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - "uv.lock"
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: Install backend dependencies
        run: UV_SYSTEM_PYTHON=1 uv sync --locked

      - name: Upgrade pip to patched version
        run: uv pip install --system "pip>=26.1.2"

      # Audits the installed environment (backend deps + pip-audit's own deps).
      # Replaces `pip-audit -r` which forces a dry-run pip resolve; see #920.
      - name: Run pip-audit
        run: pip-audit
