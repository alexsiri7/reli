name: Dependency Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "frontend/package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "uv.lock"
      - "frontend/package-lock.json"
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: Install backend dependencies
        run: UV_SYSTEM_PYTHON=1 uv sync --locked

      - name: Upgrade pip to patched version
        run: uv pip install --system "pip>=26.1.2"

      # Audits the installed environment (backend deps + pip-audit's own deps).
      # Replaces `pip-audit -r` which forces a dry-run pip resolve; see #920.
      - name: Run pip-audit
        run: pip-audit

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Audits the lockfile directly; no install needed.
      - name: Run npm audit
        working-directory: frontend
        run: npm audit
