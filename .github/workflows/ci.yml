name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatched run tests and builds without publishing, so the daily build-drift check can
  # exercise main without deploying it (#1661).
  workflow_dispatch:
  # The weekly run audits the pinned dependencies between pushes (#1815); it cannot deploy,
  # because the staging pipeline follows only a push run.
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: UV_SYSTEM_PYTHON=1 uv sync --locked

      - name: Setup
        run: ./scripts/gates.sh setup

      - name: Lint & Typecheck
        run: ./scripts/gates.sh lint typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: UV_SYSTEM_PYTHON=1 uv sync --locked

      - name: Setup
        run: ./scripts/gates.sh setup

      - name: Test
        run: ./scripts/gates.sh test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Pinned to the @playwright/test version in frontend/package.json; the tag and digest are bumped
    # together with it. The committed snapshots were generated in this image; any other renders
    # different pixels and fails on nothing real.
    container: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checkout is owned by a different uid inside the container, and gates.sh opens with
      # `git rev-parse --show-toplevel`, which git refuses on a repository it calls dubious.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Frontend
        run: ./scripts/gates.sh frontend

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The OIDC token is the keyless cosign signing identity (#1817).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/alexsiri7/reli:${{ github.sha }}
            ghcr.io/alexsiri7/reli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow on refs/heads/main, which is what the deploy
      # checks before it sends a digest to Railway (#1817). Signed by digest, so the signature
      # covers exactly the bytes just pushed.
      - name: Sign image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/alexsiri7/reli@${DIGEST}"

  unsafe-change-tests:
    # The unsafe-change check itself runs from the base branch
    # (pull_request_target), so a PR changing it is only tested here.
    name: unsafe-change checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests (system python3 + PyYAML, as the check uses)
        run: python3 -m unittest discover -s .github/unsafe-change

  # A failing audit fails this run, which is what keeps the staging pipeline from deploying (#1815).
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: Install backend dependencies
        run: UV_SYSTEM_PYTHON=1 uv sync --locked

      - name: Upgrade pip to patched version
        run: uv pip install --system "pip>=26.1.2"

      # Audits the installed environment (backend deps + pip-audit's own deps).
      # Replaces `pip-audit -r` which forces a dry-run pip resolve; see #920.
      - name: Run pip-audit
        run: pip-audit

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Both audit the lockfile directly; no install needed. What ships is audited with no
      # exceptions; the whole tree fails on every advisory scripts/npm_audit.py does not record.
      - name: Run npm audit on shipped dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Run npm audit on every dependency
        working-directory: frontend
        run: python3 ../scripts/npm_audit.py

  # Deploy moved to staging-pipeline.yml — CI success triggers staging deploy,
  # then production deploy (with rollback) after staging health check passes.
