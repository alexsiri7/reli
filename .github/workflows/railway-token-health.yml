name: Railway Token Health Check

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 09:00 UTC
  workflow_dispatch:

jobs:
  check-token:
    name: Validate Railway ${{ matrix.environment }} token
    runs-on: ubuntu-latest
    # Each Railway token is a project token scoped to one Railway environment and
    # stored as that GitHub environment's secret, usable only from main (SEC-003).
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            env_id_secret: RAILWAY_STAGING_ENVIRONMENT_ID
          - environment: production
            env_id_secret: RAILWAY_PRODUCTION_ENVIRONMENT_ID
    environment: ${{ matrix.environment }}
    permissions:
      issues: write
    steps:
      - name: Check RAILWAY_PROJECT_TOKEN validity
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          ENV_ID: ${{ secrets[matrix.env_id_secret] }}
          TOKEN_ENV: ${{ matrix.environment }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create_issue_if_absent() {
            local search_term="$1" title="$2" body="$3"
            EXISTING=$(gh issue list \
              --repo alexsiri7/reli \
              --state open \
              --search "$search_term" \
              --json number \
              --jq '.[0].number // empty')
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --repo alexsiri7/reli \
                --title "$title" \
                --body "$body" \
                --label bug
            fi
          }

          if [ -z "$RAILWAY_TOKEN" ]; then
            create_issue_if_absent "Railway $TOKEN_ENV token missing" \
              "Railway $TOKEN_ENV token missing — RAILWAY_PROJECT_TOKEN is not set in the $TOKEN_ENV environment" \
              "The $TOKEN_ENV GitHub environment has no RAILWAY_PROJECT_TOKEN secret. See DEPLOYMENT_SECRETS.md for how to create and store it."
            exit 1
          fi
          RESP=$(curl -sf -X POST "https://backboard.railway.app/graphql/v2" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{projectToken{environmentId}}"}')
          if ! echo "$RESP" | jq -e --arg env "$ENV_ID" '.data.projectToken.environmentId == $env' > /dev/null 2>&1; then
            MSG=$(echo "$RESP" | jq -r '.errors[0].message // "token rejected, unreachable API, or token scoped to another environment"')
            create_issue_if_absent "Railway $TOKEN_ENV token expired" \
              "Railway $TOKEN_ENV token expired — rotate RAILWAY_PROJECT_TOKEN before next deploy" \
              "Daily token health check failed for $TOKEN_ENV: \`$MSG\`. See DEPLOYMENT_SECRETS.md for rotation instructions."
            exit 1
          fi
          echo "RAILWAY_PROJECT_TOKEN for $TOKEN_ENV is valid."
