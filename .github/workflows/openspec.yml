name: OpenSpec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate specs
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Pinned: 1.14.1 promoted the long-requirement finding from INFO to WARNING, which --strict
      # fails on, so a floating version can turn this check red with no change to the specs.
      - name: Validate specs
        run: npx -y @fission-ai/openspec@1.14.0 validate --specs --strict
